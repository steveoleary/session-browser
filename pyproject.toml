[build-system]
# 77 is the first release that understands the SPDX `license` string and
# `license-files` below; 61 would silently ignore them.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-browser"
version = "0.1.0"
description = "Find and retrieve prior agent sessions across Claude Code, Codex and OpenCode — a fast CLI and TUI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Steve O'Leary", email = "647621+steveoleary@users.noreply.github.com" },
]
keywords = ["agent", "claude-code", "codex", "opencode", "sessions", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # The declared floor above, up to the version the suite is run on.
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=15.0.0",
  "textual>=0.80.0",
]

# Test dependencies live in the `dev` dependency-group below, not in an extra.
# `uv sync` installs that group by default, which is how this repo's suite is
# actually run; nothing referenced the extra.

[project.urls]
Homepage = "https://github.com/steveoleary/session-browser"
Repository = "https://github.com/steveoleary/session-browser"
Issues = "https://github.com/steveoleary/session-browser/issues"

[project.scripts]
session-browser = "session_browser.app:main"

[tool.setuptools]
packages = ["session_browser"]

[tool.setuptools.data-files]
"share/session-browser/skills/using-session-browser" = ["skills/using-session-browser/SKILL.md"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
python_files = ["tests.py", "test_*.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "prototypes"]
# Ruff's default. Measured against this codebase's own ~79-column habit: 79
# produced *more* churn, not less, because more lines breached it and got
# exploded one-argument-per-line. The tool owns the width from here.
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
ignore = [
  # A TUI renders "×", "›" and en dashes on purpose; the ASCII lookalikes
  # would be a downgrade, not a fix.
  "RUF001", "RUF002",
  # `a + [b]` over `[*a, b]`. Pure style, and the concatenation form reads
  # better for the argv lists this codebase builds.
  "RUF005",
  # Discovery walks session files written by three other tools. A broken
  # file must skip one session, not kill the scan, so the blind excepts are
  # the design; every one of them logs.
  "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the job.
"session_browser/tests.py" = ["S101"]
"session_browser/test_*.py" = ["S101"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
]
